<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Members & Team · CincySI Lab</title>
  <meta name="description" content="Meet the people of the CincySI Lab: faculty, Ph.D. candidates, graduate researchers, and postdocs.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-silver text-ink antialiased min-h-screen flex flex-col">

  <div id="site-header"></div>

    <p class="text-xs font-semibold uppercase tracking-[0.2em] text-red">People</p>

    <!-- Group photo -->
    <div class="mt-10" data-render="group-photo"></div>

    <!-- Members grid -->
    <h2 class="mt-16 mb-8 text-2xl font-bold tracking-tight">Lab Members</h2>
    <div data-render="members" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"></div>

  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
