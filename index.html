<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CincySI Lab · Super Intelligence Lab, University of Cincinnati</title>
  <meta name="description" content="CincySI Lab (Super Intelligence Lab) at the University of Cincinnati: research in data science, AI, and human-centred computing.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-silver text-ink antialiased min-h-screen flex flex-col">

  <div id="site-header"></div>

  <main class="flex-1">

    <!-- Hero -->
    <section class="bg-coal text-white">
      <div class="max-w-6xl mx-auto px-5 sm:px-8 py-20 md:py-28" data-render="mission"></div>
    </section>

    <!-- News & announcements -->
    <section class="max-w-6xl mx-auto px-5 sm:px-8 py-16 md:py-20 grid gap-12 lg:grid-cols-[1fr_2fr]">
      <div>
        <p class="text-xs font-semibold uppercase tracking-[0.2em] text-red">Lab pulse</p>
        <h2 class="mt-3 text-3xl font-bold tracking-tight">Latest News</h2>
        <p class="mt-3 text-muted leading-relaxed text-sm">New papers, awards, talks, and openings.</p>
        <a href="publications.html" class="mt-5 inline-flex items-center gap-1 text-sm font-semibold text-red hover:text-deep transition-colors">
          All publications →
        </a>
      </div>
      <div data-render="news" data-limit="5" class="bg-white rounded-2xl border border-border px-6 divide-y divide-border"></div>
    </section>

    <!-- Group photo -->
    <section class="max-w-6xl mx-auto px-5 sm:px-8 pb-20">
      <div data-render="group-photo"></div>
    </section>

  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
