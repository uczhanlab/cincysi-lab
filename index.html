<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CincySI Lab — Super Intelligence Lab at UC</title>
  <meta name="description" content="CincySI Super Intelligence Lab at the University of Cincinnati — AI research, publications, and lab members." />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="js/theme.js"></script>
  <script src="js/data.js"></script>
</head>
<body class="bg-silver text-ink flex flex-col min-h-screen font-sans">

  <div id="site-header"></div>

  <main class="flex-1">

    <!-- ── HERO ── -->
    <section class="bg-coal text-white">
      <div class="max-w-6xl mx-auto px-4 sm:px-8 py-16 sm:py-24 md:py-32">
        <div data-render="mission"></div>
      </div>
    </section>

    <!-- ── GROUP PHOTO ── -->
    <section class="max-w-6xl mx-auto px-4 sm:px-8 py-12 sm:py-16">
      <div data-render="group-photo"></div>
    </section>

    <!-- ── TECH & AI NEWS ── -->
    <section class="bg-white border-y border-border">
      <div class="max-w-6xl mx-auto px-4 sm:px-8 py-12 sm:py-16">
        <h2 class="text-2xl sm:text-3xl font-bold text-ink mb-2">Tech &amp; AI News</h2>
        <p class="text-sm text-muted mb-6 sm:mb-8">Live updates from the AI world</p>
        <div data-render="technews"></div>
      </div>
    </section>

  </main>

  <div id="site-footer"></div>

  <script src="js/main.js"></script>
</body>
</html>
